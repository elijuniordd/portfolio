<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- sol girando -->
  <g transform="translate(150 170)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <g stroke="#fde047" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="-78" x2="0" y2="-60"/><line x1="0" y1="78" x2="0" y2="60"/>
        <line x1="-78" y1="0" x2="-60" y2="0"/><line x1="78" y1="0" x2="60" y2="0"/>
        <line x1="-55" y1="-55" x2="-42" y2="-42"/><line x1="55" y1="55" x2="42" y2="42"/>
        <line x1="-55" y1="55" x2="-42" y2="42"/><line x1="55" y1="-55" x2="42" y2="-42"/>
      </g>
    </g>
    <circle r="46" fill="#facc15"/>
  </g>

  <!-- nuvem com chuva -->
  <g transform="translate(150 210)">
    <g fill="#fff">
      <circle cx="0" cy="0" r="30"/><circle cx="36" cy="-14" r="36"/><circle cx="76" cy="2" r="28"/>
      <rect x="0" y="0" width="80" height="30" rx="15"/>
    </g>
    <g stroke="#bae6fd" stroke-width="4" stroke-linecap="round">
      <line x1="12" y1="44" x2="6" y2="58"><animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-4 14" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="40" y1="44" x2="34" y2="58"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-4 14" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></line>
      <line x1="68" y1="44" x2="62" y2="58"><animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-4 14" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <!-- resposta da API -->
  <g transform="translate(330 70)" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect width="280" height="220" rx="14" fill="#0d1117"/>
    <circle cx="18" cy="18" r="5" fill="#ff5f57"/><circle cx="34" cy="18" r="5" fill="#febc2e"/><circle cx="50" cy="18" r="5" fill="#28c840"/>
    <text x="16" y="52" font-size="12"><tspan fill="#79c0ff">GET</tspan><tspan fill="#e6edf3"> /clima?cidade=BH</tspan></text>
    <text x="16" y="76" font-size="12" fill="#3fb950">200 OK</text>
    <g font-size="12">
      <text x="16" y="104" fill="#e6edf3">{</text>
      <text x="16" y="124"><tspan fill="#e6edf3">  </tspan><tspan fill="#a5d6ff">"cidade"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffa657">"Belo Horizonte"</tspan></text>
      <text x="16" y="144"><tspan fill="#e6edf3">  </tspan><tspan fill="#a5d6ff">"temp_c"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#79c0ff">24</tspan></text>
      <text x="16" y="164"><tspan fill="#e6edf3">  </tspan><tspan fill="#a5d6ff">"condicao"</tspan><tspan fill="#e6edf3">: </tspan><tspan fill="#ffa657">"Chuva leve"</tspan></text>
      <text x="16" y="184" fill="#e6edf3">}</text>
    </g>
    <rect x="16" y="196" width="8" height="14" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <!-- folha do Spring -->
  <g transform="translate(560 300)">
    <circle r="22" fill="#6db33f"/>
    <path d="M-9 8 C -12 -6, 0 -14, 12 -12 C 12 0, 2 10, -9 8 Z" fill="#fff"/>
  </g>

  <text x="28" y="46" fill="#fff" font-size="22" font-weight="800">ClimaAPI</text>
  <text x="28" y="68" fill="#e0f2fe" font-size="13">API REST de previsão do tempo · Spring Boot</text>
</svg>
