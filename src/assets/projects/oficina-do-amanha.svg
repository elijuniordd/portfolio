<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- trilha da missão -->
  <g transform="translate(40 100)" font-size="10.5" font-weight="600" text-anchor="middle">
    <line x1="20" y1="14" x2="540" y2="14" stroke="#fed7aa" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="14" x2="20" y2="14" stroke="#ea580c" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" values="20;540;540" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
    </line>
    <g fill="#ea580c" stroke="#fff" stroke-width="3">
      <circle cx="20" cy="14" r="10"/><circle cx="124" cy="14" r="10"/><circle cx="228" cy="14" r="10"/>
      <circle cx="332" cy="14" r="10"/><circle cx="436" cy="14" r="10"/><circle cx="540" cy="14" r="10"/>
    </g>
    <g fill="#7c2d12">
      <text x="20" y="44">conhecer</text><text x="124" y="44">investigar</text><text x="228" y="44">pedir</text>
      <text x="332" y="44">testar</text><text x="436" y="44">revisar</text><text x="540" y="44">concluir</text>
    </g>
  </g>

  <!-- bairro -->
  <g transform="translate(0 210)">
    <rect y="120" width="640" height="30" fill="#9a3412" opacity="0.35"/>
    <g>
      <rect x="30" y="50" width="90" height="70" fill="#fb923c"/><path d="M22 54 L75 14 L128 54 Z" fill="#c2410c"/>
      <rect x="62" y="80" width="24" height="40" fill="#7c2d12"/>
    </g>
    <g>
      <rect x="140" y="40" width="130" height="80" fill="#fdba74"/><path d="M132 44 L205 4 L278 44 Z" fill="#ea580c"/>
      <rect x="150" y="54" width="110" height="20" rx="4" fill="#7c2d12"/>
      <text x="205" y="68" fill="#fff" font-size="11" font-weight="800" text-anchor="middle">OFICINA</text>
      <rect x="185" y="84" width="40" height="36" fill="#7c2d12"/>
    </g>
    <g>
      <rect x="480" y="56" width="80" height="64" fill="#fb923c"/><path d="M472 60 L520 24 L568 60 Z" fill="#c2410c"/>
      <rect x="508" y="84" width="22" height="36" fill="#7c2d12"/>
    </g>
  </g>

  <!-- robô (IA simulada) -->
  <g transform="translate(330 190)">
    <animateTransform attributeName="transform" type="translate" values="330 190;330 182;330 190" dur="2.4s" repeatCount="indefinite"/>
    <line x1="40" y1="0" x2="40" y2="-14" stroke="#334155" stroke-width="4"/>
    <circle cx="40" cy="-18" r="6" fill="#ea580c"><animate attributeName="fill" values="#ea580c;#facc15;#ea580c" dur="1.2s" repeatCount="indefinite"/></circle>
    <rect x="0" y="0" width="80" height="62" rx="16" fill="#475569"/>
    <rect x="12" y="14" width="56" height="28" rx="10" fill="#0f172a"/>
    <circle cx="28" cy="28" r="6" fill="#5eead4"/><circle cx="52" cy="28" r="6" fill="#5eead4"/>
    <rect x="14" y="66" width="52" height="40" rx="10" fill="#64748b"/>
  </g>

  <!-- balão de fala -->
  <g transform="translate(430 150)">
    <rect width="170" height="54" rx="14" fill="#fff" stroke="#fdba74" stroke-width="2"/>
    <path d="M14 54 L4 70 L32 54 Z" fill="#fff"/>
    <text x="14" y="23" fill="#7c2d12" font-size="11.5" font-weight="700">Qual é o problema?</text>
    <text x="14" y="41" fill="#9a3412" font-size="10.5">Vamos testar juntos.</text>
  </g>

  <text x="28" y="46" fill="#7c2d12" font-size="22" font-weight="800">Oficina do Amanhã</text>
  <text x="28" y="68" fill="#9a3412" font-size="13">Jogo educativo sobre pedir soluções a uma IA</text>
</svg>
