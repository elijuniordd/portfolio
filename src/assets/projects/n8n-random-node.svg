<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="1" stop-color="#3b1d52"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- conexões -->
  <path id="c1" d="M190 180 C 220 180, 220 180, 250 180" stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.6"/>
  <path id="c2" d="M400 180 C 430 180, 430 180, 460 180" stroke="#a78bfa" stroke-width="3" fill="none" opacity="0.6"/>
  <circle r="5" fill="#ea4b71" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.25;1" calcMode="linear"><mpath href="#c1"/></animateMotion>
  </circle>
  <circle r="5" fill="#ea4b71" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.75;1" calcMode="linear"><mpath href="#c2"/></animateMotion>
  </circle>

  <!-- nó 1: gatilho -->
  <g transform="translate(60 140)">
    <rect width="130" height="80" rx="16" fill="#2a1f45" stroke="#6d5a8f" stroke-width="2"/>
    <circle cx="32" cy="40" r="16" fill="#ea4b71"/>
    <path d="M27 31 L40 40 L27 49 Z" fill="#fff"/>
    <text x="58" y="36" fill="#fff" font-size="13" font-weight="600">Trigger</text>
    <text x="58" y="54" fill="#c4b5fd" font-size="11">manual</text>
  </g>

  <!-- nó 2: True Random -->
  <g transform="translate(250 110)">
    <rect width="150" height="140" rx="18" fill="#2a1f45" stroke="#ea4b71" stroke-width="3" filter="url(#glow)"/>
    <g transform="translate(47 18)">
      <rect width="56" height="56" rx="12" fill="#fff">
        <animateTransform attributeName="transform" type="rotate" values="0 28 28;0 28 28;12 28 28;-8 28 28;0 28 28" keyTimes="0;0.25;0.33;0.42;0.5" dur="3s" repeatCount="indefinite"/>
      </rect>
      <g fill="#ea4b71">
        <circle cx="15" cy="15" r="5"/><circle cx="41" cy="15" r="5"/>
        <circle cx="28" cy="28" r="5"/>
        <circle cx="15" cy="41" r="5"/><circle cx="41" cy="41" r="5"/>
      </g>
    </g>
    <text x="75" y="98" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">True Random</text>
    <text x="75" y="118" fill="#c4b5fd" font-size="11" text-anchor="middle">min 1 · max 100</text>
  </g>

  <!-- nó 3: saída com número mudando -->
  <g transform="translate(460 140)">
    <rect width="130" height="80" rx="16" fill="#2a1f45" stroke="#6d5a8f" stroke-width="2"/>
    <text x="16" y="26" fill="#c4b5fd" font-size="11">output</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="#fff">
      <text x="16" y="62" opacity="0">42<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.99;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="16" y="62" opacity="1">7<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.24;0.25;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="16" y="62" opacity="0">88<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="16" y="62" opacity="0">13<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.74;0.75;1" dur="12s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- rótulos -->
  <text x="32" y="48" fill="#fff" font-size="22" font-weight="700">n8n Random Node</text>
  <text x="32" y="72" fill="#c4b5fd" font-size="13">Custom node · Random.org API</text>
  <g font-size="11" font-weight="600">
    <rect x="32" y="300" width="84" height="26" rx="13" fill="#ea4b71" opacity="0.18"/>
    <text x="74" y="317" fill="#f9a8c0" text-anchor="middle">TypeScript</text>
    <rect x="124" y="300" width="48" height="26" rx="13" fill="#ea4b71" opacity="0.18"/>
    <text x="148" y="317" fill="#f9a8c0" text-anchor="middle">n8n</text>
    <rect x="180" y="300" width="64" height="26" rx="13" fill="#ea4b71" opacity="0.18"/>
    <text x="212" y="317" fill="#f9a8c0" text-anchor="middle">Docker</text>
  </g>
</svg>
